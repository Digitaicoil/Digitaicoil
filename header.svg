  <text x="290" y="160" font-family="-apple-system,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="64" font-weight="700" fill="#f4f3f8" letter-spacing="-1.5">DigitAI</text>
  <text x="292" y="214" font-family="-apple-system,'SF Pro Text','Segoe UI',Helvetica,Arial,sans-serif" font-size="28" fill="#a7a3b8">We build AI systems that do a small business's busywork:</text>
  <text x="292" y="252" font-family="-apple-system,'SF Pro Text','Segoe UI',Helvetica,Arial,sans-serif" font-size="28" fill="#a7a3b8">calls, leads, follow-ups, content. <tspan fill="#c6f432">Then we open-source the parts.</tspan></text>
